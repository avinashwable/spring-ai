spring:
  application:
    name: aiworkshop

  ai:
    chat:
      client:
        enabled: false

    openai:
      api-key: ${OPENAI_API_KEY}
      chat-options:
        model: gpt-4
        temperature: 0.7
        max-tokens: 1500

    anthropic:
      api-key: ${ANTHROPIC_API_KEY}
      chat-options:
        model: claude-2
        temperature: 0.5
        max-tokens: 1000

