spring:
  application:
    name: aiworkshop

  ai:
    retry:
      enabled: false
    chat:
      client:
        enabled: false

    openai:
      api-key: ${OPENAI_API_KEY:dummy-key-for-tests}
      chat-options:
        model: gpt-4
        temperature: 0.7
        max-tokens: 1500

    anthropic:
      api-key: ${ANTHROPIC_API_KEY:dummy-key-for-tests}
      chat-options:
        model: claude-sonnet-4-5
        temperature: 0.5
        max-tokens: 1000

logging:
  level:
    org:
      springframework:
        ai: DEBUG
